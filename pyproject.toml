[project]
name = "harness-golden-path"
version = "0.1.0"
description = "Control Harness Golden Path — minimaler deterministischer Task-Harness (ADR-001)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.6",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
